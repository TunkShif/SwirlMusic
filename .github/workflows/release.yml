name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: Install Android SDK packages
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-37.0" "build-tools;37.0.0"

      - name: Write local.properties
        env:
          SWIRL_API_BASE_URL: ${{ secrets.SWIRL_API_BASE_URL }}
          SWIRL_API_TOKEN: ${{ secrets.SWIRL_API_TOKEN }}
        run: |
          if [ -z "$SWIRL_API_BASE_URL" ] || [ -z "$SWIRL_API_TOKEN" ]; then
            echo "error: SWIRL_API_BASE_URL / SWIRL_API_TOKEN secret is empty" >&2
            exit 1
          fi
          {
            echo "sdk.dir=$ANDROID_HOME"
            echo "swirl.apiBaseUrl=$SWIRL_API_BASE_URL"
            echo "swirl.apiToken=$SWIRL_API_TOKEN"
          } > local.properties

      - name: Build unsigned release APK
        run: ./gradlew :app:assembleRelease

      - name: Decode release keystore
        env:
          SWIRL_KEYSTORE_BASE64: ${{ secrets.SWIRL_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$SWIRL_KEYSTORE_BASE64" ]; then
            echo "error: SWIRL_KEYSTORE_BASE64 secret is empty" >&2
            exit 1
          fi
          echo "$SWIRL_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"

      - name: Package, align and sign APKs
        env:
          SWIRL_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          SWIRL_KEYSTORE_PASSWORD: ${{ secrets.SWIRL_KEYSTORE_PASSWORD }}
          EXPECTED_VERSION: ${{ github.ref_name }}
        run: |
          export EXPECTED_VERSION="${EXPECTED_VERSION#v}"
          bash .github/scripts/package-apks.sh \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            dist

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "$GITHUB_REF_NAME" dist/*
          --title "$GITHUB_REF_NAME" --generate-notes --verify-tag
